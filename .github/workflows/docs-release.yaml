name: Docs Release
on:
  release:
    types: [published]

permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Credentials are intentionally persisted: `mike deploy --push` below
          # uses the checkout token to push the built docs to the gh-pages branch.
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.14.9
      - name: Install Dependencies
        run: |
          pip install -r docs/requirements.txt
      - name: Setup Docs Deploy
        run: |
          git config --global user.name "Docs Deploy"
          git config --global user.email "docs.deploy@opendefense.cloud"
      - name: Build Docs Website
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mike deploy --push --update-aliases "$RELEASE_TAG" latest
