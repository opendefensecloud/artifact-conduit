name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # for keyless cosign sign-blob
  attestations: write # for build-provenance attestation

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    # go comes from the flake. cosign comes from cosign-installer on the
    # runner PATH; nix develop inherits PATH so it remains reachable from
    # inside the dev shell. No actions/cache here: this is a privileged
    # signing job, so it deliberately does not share a Go cache with
    # unprivileged workflows (cache poisoning). This replaces the previous
    # setup-go `cache: false`.
    defaults:
      run:
        shell: nix develop --command bash -e {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up nix with the shared Cachix cache
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@7427f5e62c1c45ec058e3e2b483a75d9dbe48805 # v2.2.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Run tests
        run: make test

      - name: Build binaries
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              for cmd in arc-apiserver arc-controller-manager; do
                CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                  go build -ldflags="-s -w" \
                  -o "bin/${cmd}-${os}-${arch}" "./cmd/${cmd}"
              done
            done
          done

      - name: Create checksums
        run: |
          find bin -type f ! -name checksums.txt | sort | xargs sha256sum > bin/checksums.txt

      - name: Attest build provenance
        # actions/attest defaults to SLSA build provenance when no sbom-path or
        # predicate input is given.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'bin/arc-*-*' # binaries only; runs before signing so the .sigstore.json bundles are not yet present

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artefacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cd bin
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sigstore.json) continue ;; esac
            # Emit a Sigstore bundle (signature + cert + Rekor proof), named
            # *.sigstore.json so OpenSSF Scorecard's Signed-Releases check
            # detects it. Don't revert to --output-signature/--output-certificate:
            # those are deprecated and silently ignored by newer cosign, which
            # defaults to the bundle format and requires --bundle.
            cosign sign-blob --yes \
              --new-bundle-format=true \
              --bundle "${f}.sigstore.json" \
              "$f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Release notes are curated by release-drafter; only attach the signed
          # assets here so the drafted notes are preserved.
          files: |
            bin/*
          # Immutable releases forbid uploading assets to an already-published
          # release, so create a draft with the signed artefacts attached and
          # publish it separately (UI, or `gh release edit <tag> --draft=false`).
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
