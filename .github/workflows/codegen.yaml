name: Codegen Check
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-24.04
    # go and the codegen tools come from the flake and tools.lock.
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up nix with the shared Cachix cache
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@c9fbc95b84be3c9acdb02656091eca21dfee8501 # v3.0.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Run codegen
        run: |
          make codegen
      - name: Check for changes
        uses: opendefensecloud/dev-kit/.github/actions/diff-check@c9fbc95b84be3c9acdb02656091eca21dfee8501 # v3.0.0
