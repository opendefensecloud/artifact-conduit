name: Docs Develop
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - mkdocs.yml
      - .github/workflows/docs-develop.yaml
      - Makefile

permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Credentials are intentionally persisted: `mike deploy --push` below
          # uses the checkout token to push the built docs to the gh-pages branch.
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14.5
      - name: Install Dependencies
        run: |
          pip install -r docs/requirements.txt
      - name: Setup Docs Deploy
        run: |
          git config --global user.name "Docs Deploy"
          git config --global user.email "docs.deploy@opendefense.cloud"
      - name: Build Docs Website
        run: |
          mike deploy --push develop
