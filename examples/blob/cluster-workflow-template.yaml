apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: blob-pipeline
spec:
  retryStrategy:
    retryPolicy: OnError
    limit: 1

  serviceAccountName: arc-workflow

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specKey # The source file path (e.g., file.txt)
      - name: specOverride # The target file path (e.g., some/other.txt)
      - name: specMd5 # The md5 checksum of the source file (e.g., 5eb63bbbe01eeed093cb22bb8f5acdc3), optional
      - name: storageQuota # Additional parameter coming from ArtifactType

  entrypoint: pipeline

  templates:
    # --- Main Pipeline Entrypoint ---
    - name: pipeline
      steps:
        - - name: check-availability
            template: check-availability

        - - name: determine-size-s3
            template: determine-size-s3
            when: "{{workflow.parameters.srcType}} == 's3'"

        - - name: generate-volume-s3
            template: generate-volume
            when: " {{workflow.parameters.srcType}} == 's3'"
            arguments:
              parameters:
                - name: file-size
                  value: "{{steps.determine-size-s3.outputs.result}}"

        - - name: pull-s3
            template: pull-s3
            when: "{{workflow.parameters.srcType}} == 's3'"

        - - name: determine-size-http
            template: determine-size-http
            when: " {{workflow.parameters.srcType}} == 'http'"

        - - name: generate-volume-http
            template: generate-volume
            when: "{{workflow.parameters.srcType}} == 'http'"
            arguments:
              parameters:
                - name: file-size
                  value: "{{steps.determine-size-http.outputs.result}}"

        - - name: pull-http
            template: pull-http
            when: "{{workflow.parameters.srcType}} == 'http'"

        - - name: scan-clamav
            template: scan-clamav

        - - name: push
            template: push

    # --- Check Availability in Destination (aws-cli) ---
    - name: check-availability
      retryStrategy:
        limit: "2"

      script:
        image: amazon/aws-cli:2.34.39
        command: [sh, -c]
        volumeMounts:
          - &dstSecretMount
            name: dst-secret-vol
            mountPath: /secrets/dst

        source: |
          AWS_NO_AUTH=""
          if [ "{{workflow.parameters.dstSecret}}" = "true" ]; then
              export AWS_ACCESS_KEY_ID=$(cat /secrets/dst/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /secrets/dst/AWS_SECRET_ACCESS_KEY)
              if [ -f /secrets/dst/AWS_SESSION_TOKEN ]; then
                  export AWS_SESSION_TOKEN=$(cat /secrets/dst/AWS_SESSION_TOKEN)
              fi
          else
              AWS_NO_AUTH="--no-sign-request"
          fi

          if [[ ! -z ${{workflow.parameters.specMd5}} ]]; then
            BUCKET=$(echo "{{workflow.parameters.specKey}}" | cut -d/ -f1)
            KEY=$(echo "{{workflow.parameters.specKey}}" | cut -d/ -f2-)

            MD5=$(aws $AWS_NO_AUTH --endpoint-url "{{workflow.parameters.dstRemoteURL}}" s3api head-object --bucket "$BUCKET" --key "$KEY" --query ETag --output text --no-cli-pager)
            if [ $? -eq 254 ]; then
                echo "unavailable"
                exit 0
            fi

            if [ $? -eq 0 ]; then
              if [[ $MD5 != {{workflow.parameters.specMd5}} ]]; then
                echo "md5 mismatch, aborting"
                exit 1
              else
                echo "available"
                exit 0
              fi
            fi

            echo "unavailable"
            exit 0
          else
            aws $AWS_NO_AUTH --endpoint-url "{{workflow.parameters.dstRemoteURL}}" s3 ls "{{workflow.parameters.specKey}}" >/dev/null 2>&1
            if [ $? -eq 0 ]; then
                echo "available"
            else
                echo "unavailable"
            fi
          fi
          exit 0

    - name: determine-size-s3
      script:
        image: amazon/aws-cli:2.34.39
        command: [sh, -c]
        volumeMounts:
          - &srcSecretMount
            name: src-secret-vol
            mountPath: /secrets/src

        source: |
          set -euo pipefail

          AWS_NO_AUTH=""
          if [ "{{workflow.parameters.srcSecret}}" = "true" ]; then
              export AWS_ACCESS_KEY_ID=$(cat /secrets/src/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /secrets/src/AWS_SECRET_ACCESS_KEY)
              if [ -f /secrets/src/AWS_SESSION_TOKEN ]; then
                  export AWS_SESSION_TOKEN=$(cat /secrets/src/AWS_SESSION_TOKEN)
              fi
          else
              AWS_NO_AUTH="--no-sign-request"
          fi

          BUCKET=$(echo "{{workflow.parameters.specKey}}" | cut -d/ -f1)
          KEY=$(echo "{{workflow.parameters.specKey}}" | cut -d/ -f2-)

          FILE_SIZE_BYTES=$(aws $AWS_NO_AUTH --endpoint-url "{{workflow.parameters.srcRemoteURL}}" s3api head-object --bucket "$BUCKET" --key "$KEY" --query 'ContentLength' --output text)

          if [ -z "$FILE_SIZE_BYTES" ]; then
            exit 1
          fi
          if [[ "$FILE_SIZE_BYTES" -gt "{{workflow.parameters.storageQuota}}" ]]; then
            echo "File size $FILE_SIZE_BYTES bigger than storage quota of {{workflow.parameters.storageQuota}} bytes."
            exit 1
          fi

          echo "$(expr ${FILE_SIZE_BYTES} / 1024 + 100)Mi"

    - name: determine-size-http
      script:
        image: quay.io/curl/curl:8.19.0
        command: [sh, -c]

        source: |
          set -euo pipefail

          FILE_SIZE_BYTES=$(curl -sI "{{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specKey}}" | grep -i Content-Length | awk '{print $2}')

          if [ -z "$FILE_SIZE_BYTES" ]; then
            exit 1
          fi
          if [[ "$FILE_SIZE_BYTES" -gt "{{workflow.parameters.storageQuota}}" ]]; then
            echo "File size $FILE_SIZE_BYTES bigger than storage quota of {{workflow.parameters.storageQuota}} bytes."
            exit 1
          fi

          FILE_SIZE_BYTES=$(echo $FILE_SIZE_BYTES | tr '\r' ' ')
          echo "$(expr ${FILE_SIZE_BYTES} / 1024 + 100)Mi"

    - name: generate-volume
      inputs:
        parameters:
          - name: file-size
      resource:
        action: create
        setOwnerReference: true
        manifest: |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: {{ workflow.name }}
          spec:
            accessModes: ['ReadWriteOnce']
            resources:
              requests:
                storage: "{{inputs.parameters.file-size}}"

    - name: pull-s3
      volumes:
        - &workDir
          name: work-volume
          persistentVolumeClaim:
            claimName: "{{ workflow.name }}"
      script:
        image: amazon/aws-cli:2.34.39
        command: [sh, -c]
        volumeMounts:
          - &workDirMount
            name: work-volume
            mountPath: /data
          - *srcSecretMount
        source: |
          set -euo pipefail

          AWS_NO_AUTH=""
          if [ "{{workflow.parameters.srcSecret}}" = "true" ]; then
              export AWS_ACCESS_KEY_ID=$(cat /secrets/src/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /secrets/src/AWS_SECRET_ACCESS_KEY)
              if [ -f /secrets/src/AWS_SESSION_TOKEN ]; then
                  export AWS_SESSION_TOKEN=$(cat /secrets/src/AWS_SESSION_TOKEN)
              fi
          else
              AWS_NO_AUTH="--no-sign-request"
          fi

          mkdir -p /data/storage
          echo "Downloading {{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specKey}}..."
          aws $AWS_NO_AUTH --endpoint-url "{{workflow.parameters.srcRemoteURL}}" s3 cp "s3://{{workflow.parameters.specKey}}" "/data/storage/file"

    - name: pull-http
      volumes:
        - *workDir
      script:
        image: quay.io/curl/curl:8.19.0
        command: [sh, -c]
        volumeMounts:
          - *workDirMount

        source: |
          set -euo pipefail
          mkdir -p /data/storage
          echo "Downloading {{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specKey}}..."
          curl --output "/data/storage/file" "{{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specKey}}"

    - name: scan-clamav
      volumes:
        - *workDir
      script:
        image: clamav/clamav-debian:1.5.2-37
        command: ["/bin/bash", "-c"]
        volumeMounts:
          - *workDirMount
        source: |
          set -euo pipefail
          echo "Scanning blob with ClamAV..."
          clamscan /data/storage/

    - name: push
      volumes:
        - *workDir
      script:
        image: amazon/aws-cli:2.34.39
        command: [sh, -c]
        volumeMounts:
          - *workDirMount
          - *dstSecretMount
        source: |
          set -euo pipefail

          AWS_NO_AUTH=""
          if [ "{{workflow.parameters.dstSecret}}" = "true" ]; then
              export AWS_ACCESS_KEY_ID=$(cat /secrets/dst/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /secrets/dst/AWS_SECRET_ACCESS_KEY)
              if [ -f /secrets/dst/AWS_SESSION_TOKEN ]; then
                  export AWS_SESSION_TOKEN=$(cat /secrets/dst/AWS_SESSION_TOKEN)
              fi
          else
              AWS_NO_AUTH="--no-sign-request"
          fi

          echo "Uploading {{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}..."
          aws $AWS_NO_AUTH --endpoint-url "{{workflow.parameters.dstRemoteURL}}" s3 cp "/data/storage/file" "s3://{{workflow.parameters.specOverride}}"
