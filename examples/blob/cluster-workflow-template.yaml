apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: blob-pipeline
spec:
  retryStrategy:
    retryPolicy: OnError
    limit: 1

  serviceAccountName: arc-workflow

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specKey # The source file path (e.g., file.txt)
      - name: specOverride # The target file path (e.g., some/other.txt)
      - name: specMd5 # The md5 checksum of the source file (e.g., 5eb63bbbe01eeed093cb22bb8f5acdc3), optional
      - name: storageQuota # Additional parameter coming from ArtifactType

  entrypoint: pipeline

  templates:
    # --- Main Pipeline Entrypoint ---
    - name: pipeline
      steps:
        - - name: check-availability
            template: check-availability

        - - name: determine-size-s3
            template: determine-size-s3
            when: "{{workflow.parameters.srcType}} == 's3'"

        - - name: generate-volume-s3
            template: generate-volume
            when: " {{workflow.parameters.srcType}} == 's3'"
            arguments:
              parameters:
                - name: file-size
                  value: "{{steps.determine-size-s3.outputs.result}}"

        - - name: pull-s3
            template: pull-s3
            when: "{{workflow.parameters.srcType}} == 's3'"

        - - name: determine-size-http
            template: determine-size-http
            when: " {{workflow.parameters.srcType}} == 'http'"

        - - name: generate-volume-http
            template: generate-volume
            when: "{{workflow.parameters.srcType}} == 'http'"
            arguments:
              parameters:
                - name: file-size
                  value: "{{steps.determine-size-http.outputs.result}}"

        - - name: pull-http
            template: pull-http
            when: "{{workflow.parameters.srcType}} == 'http'"

        - - name: scan-clamav
            template: scan-clamav

        - - name: push
            template: push

    # --- Check Availability in Destination (aws-cli) ---
    - name: check-availability
      retryStrategy:
        limit: "2"

      script:
        image: amazon/aws-cli:2.37.11
        command: [sh, -c]
        volumeMounts:
          - &dstSecretMount
            name: dst-secret-vol
            mountPath: /secrets/dst

        # spec* parameters are the fields of the artifact's spec in the Order,
        # chosen by whoever creates the Order. All parameters are passed in as
        # environment variables and never interpolated into the scripts.
        # The spec* variables come first, because Kubernetes expands $(VAR) in a
        # value with the variables defined before it.
        env: &env
          - name: SPEC_KEY
            value: "{{workflow.parameters.specKey}}"
          - name: SPEC_OVERRIDE
            value: "{{workflow.parameters.specOverride}}"
          - name: SPEC_MD5
            value: "{{workflow.parameters.specMd5}}"
          - name: SRC_REMOTE_URL
            value: "{{workflow.parameters.srcRemoteURL}}"
          - name: SRC_SECRET
            value: "{{workflow.parameters.srcSecret}}"
          - name: DST_REMOTE_URL
            value: "{{workflow.parameters.dstRemoteURL}}"
          - name: DST_SECRET
            value: "{{workflow.parameters.dstSecret}}"
          - name: STORAGE_QUOTA
            value: "{{workflow.parameters.storageQuota}}"

        source: |
          AWS_NO_AUTH=""
          if [ "${DST_SECRET}" = "true" ]; then
              export AWS_ACCESS_KEY_ID=$(cat /secrets/dst/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /secrets/dst/AWS_SECRET_ACCESS_KEY)
              if [ -f /secrets/dst/AWS_SESSION_TOKEN ]; then
                  export AWS_SESSION_TOKEN=$(cat /secrets/dst/AWS_SESSION_TOKEN)
              fi
          else
              AWS_NO_AUTH="--no-sign-request"
          fi

          if [[ -n "$SPEC_MD5" ]]; then
            BUCKET=$(echo "${SPEC_KEY}" | cut -d/ -f1)
            KEY=$(echo "${SPEC_KEY}" | cut -d/ -f2-)

            MD5=$(aws $AWS_NO_AUTH --endpoint-url "${DST_REMOTE_URL}" s3api head-object --bucket "$BUCKET" --key "$KEY" --query ETag --output text --no-cli-pager)
            if [ $? -eq 254 ]; then
                echo "unavailable"
                exit 0
            fi

            if [ $? -eq 0 ]; then
              if [[ "$MD5" != "$SPEC_MD5" ]]; then
                echo "md5 mismatch, aborting"
                exit 1
              else
                echo "available"
                exit 0
              fi
            fi

            echo "unavailable"
            exit 0
          else
            aws $AWS_NO_AUTH --endpoint-url "${DST_REMOTE_URL}" s3 ls "s3://${SPEC_KEY}" >/dev/null 2>&1
            if [ $? -eq 0 ]; then
                echo "available"
            else
                echo "unavailable"
            fi
          fi
          exit 0

    - name: determine-size-s3
      script:
        image: amazon/aws-cli:2.37.11
        command: [sh, -c]
        volumeMounts:
          - &srcSecretMount
            name: src-secret-vol
            mountPath: /secrets/src

        env: *env
        source: |
          set -euo pipefail

          AWS_NO_AUTH=""
          if [ "${SRC_SECRET}" = "true" ]; then
              export AWS_ACCESS_KEY_ID=$(cat /secrets/src/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /secrets/src/AWS_SECRET_ACCESS_KEY)
              if [ -f /secrets/src/AWS_SESSION_TOKEN ]; then
                  export AWS_SESSION_TOKEN=$(cat /secrets/src/AWS_SESSION_TOKEN)
              fi
          else
              AWS_NO_AUTH="--no-sign-request"
          fi

          BUCKET=$(echo "${SPEC_KEY}" | cut -d/ -f1)
          KEY=$(echo "${SPEC_KEY}" | cut -d/ -f2-)

          FILE_SIZE_BYTES=$(aws $AWS_NO_AUTH --endpoint-url "${SRC_REMOTE_URL}" s3api head-object --bucket "$BUCKET" --key "$KEY" --query 'ContentLength' --output text)

          if [ -z "$FILE_SIZE_BYTES" ]; then
            exit 1
          fi
          if [[ "$FILE_SIZE_BYTES" -gt "${STORAGE_QUOTA}" ]]; then
            echo "File size $FILE_SIZE_BYTES bigger than storage quota of ${STORAGE_QUOTA} bytes."
            exit 1
          fi

          echo "$(expr ${FILE_SIZE_BYTES} / 1024 + 100)Mi"

    - name: determine-size-http
      script:
        image: quay.io/curl/curl:8.20.0
        command: [sh, -c]

        env: *env
        source: |
          set -euo pipefail

          FILE_SIZE_BYTES=$(curl -sI "${SRC_REMOTE_URL}/${SPEC_KEY}" | grep -i Content-Length | awk '{print $2}')

          if [ -z "$FILE_SIZE_BYTES" ]; then
            exit 1
          fi
          if [[ "$FILE_SIZE_BYTES" -gt "${STORAGE_QUOTA}" ]]; then
            echo "File size $FILE_SIZE_BYTES bigger than storage quota of ${STORAGE_QUOTA} bytes."
            exit 1
          fi

          FILE_SIZE_BYTES=$(echo $FILE_SIZE_BYTES | tr '\r' ' ')
          echo "$(expr ${FILE_SIZE_BYTES} / 1024 + 100)Mi"

    - name: generate-volume
      inputs:
        parameters:
          - name: file-size
      resource:
        action: create
        setOwnerReference: true
        manifest: |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: {{ workflow.name }}
          spec:
            accessModes: ['ReadWriteOnce']
            resources:
              requests:
                storage: "{{inputs.parameters.file-size}}"

    - name: pull-s3
      volumes:
        - &workDir
          name: work-volume
          persistentVolumeClaim:
            claimName: "{{ workflow.name }}"
      script:
        image: amazon/aws-cli:2.37.11
        command: [sh, -c]
        volumeMounts:
          - &workDirMount
            name: work-volume
            mountPath: /data
          - *srcSecretMount
        env: *env
        source: |
          set -euo pipefail

          AWS_NO_AUTH=""
          if [ "${SRC_SECRET}" = "true" ]; then
              export AWS_ACCESS_KEY_ID=$(cat /secrets/src/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /secrets/src/AWS_SECRET_ACCESS_KEY)
              if [ -f /secrets/src/AWS_SESSION_TOKEN ]; then
                  export AWS_SESSION_TOKEN=$(cat /secrets/src/AWS_SESSION_TOKEN)
              fi
          else
              AWS_NO_AUTH="--no-sign-request"
          fi

          mkdir -p /data/storage
          echo "Downloading ${SRC_REMOTE_URL}/${SPEC_KEY}..."
          aws $AWS_NO_AUTH --endpoint-url "${SRC_REMOTE_URL}" s3 cp "s3://${SPEC_KEY}" "/data/storage/file"

    - name: pull-http
      volumes:
        - *workDir
      script:
        image: quay.io/curl/curl:8.20.0
        command: [sh, -c]
        volumeMounts:
          - *workDirMount

        env: *env
        source: |
          set -euo pipefail
          mkdir -p /data/storage
          echo "Downloading ${SRC_REMOTE_URL}/${SPEC_KEY}..."
          curl --output "/data/storage/file" "${SRC_REMOTE_URL}/${SPEC_KEY}"

    - name: scan-clamav
      volumes:
        - *workDir
      script:
        image: clamav/clamav-debian:1.5.4
        command: ["/bin/bash", "-c"]
        volumeMounts:
          - *workDirMount
        source: |
          set -euo pipefail
          echo "Scanning blob with ClamAV..."
          clamscan /data/storage/

    - name: push
      volumes:
        - *workDir
      script:
        image: amazon/aws-cli:2.37.11
        command: [sh, -c]
        volumeMounts:
          - *workDirMount
          - *dstSecretMount
        env: *env
        source: |
          set -euo pipefail

          AWS_NO_AUTH=""
          if [ "${DST_SECRET}" = "true" ]; then
              export AWS_ACCESS_KEY_ID=$(cat /secrets/dst/AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(cat /secrets/dst/AWS_SECRET_ACCESS_KEY)
              if [ -f /secrets/dst/AWS_SESSION_TOKEN ]; then
                  export AWS_SESSION_TOKEN=$(cat /secrets/dst/AWS_SESSION_TOKEN)
              fi
          else
              AWS_NO_AUTH="--no-sign-request"
          fi

          echo "Uploading ${DST_REMOTE_URL}/${SPEC_OVERRIDE}..."
          aws $AWS_NO_AUTH --endpoint-url "${DST_REMOTE_URL}" s3 cp "/data/storage/file" "s3://${SPEC_OVERRIDE}"
