apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: blob-pipeline
spec:
  retryStrategy:
    retryPolicy: OnError
    limit: 1

  serviceAccountName: arc-workflow
  securityContext:
    fsGroup: 65532
    runAsUser: 65532

  # Mount certificate bundle
  volumes:
    - name: ca-certificates
      configMap:
        name: "root-bundle"
        defaultMode: 0644
        optional: false
        items:
          - key: trust-bundle.pem
            path: trust-bundle.pem

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specKey # The source file path (e.g., file.txt)
      - name: specOverride # The target file path (e.g., some/other.txt)
      - name: specMd5 # The md5 checksum of the source file (e.g., 5eb63bbbe01eeed093cb22bb8f5acdc3), optional
      - name: storageQuota # Additional parameter coming from ArtifactType

  entrypoint: pipeline

  templates:
    # --- Main Pipeline Entrypoint ---
    - name: pipeline
      steps:
        # - - name: check-availability
        #     template: check-availability

        - - name: determine-size-s3
            template: determine-size-s3
            when: "{{workflow.parameters.srcType}} == 's3'"

        - - name: generate-volume-s3
            template: generate-volume
            when: " {{workflow.parameters.srcType}} == 's3'"
            arguments:
              parameters:
                - name: file-size
                  value: "{{steps.determine-size-s3.outputs.result}}"

        - - name: pull-s3
            template: pull-s3
            when: "{{workflow.parameters.srcType}} == 's3'"

        - - name: determine-size-http
            template: determine-size-http
            when: " {{workflow.parameters.srcType}} == 'http'"

        - - name: generate-volume-http
            template: generate-volume
            when: "{{workflow.parameters.srcType}} == 'http'"
            arguments:
              parameters:
                - name: file-size
                  value: "{{steps.determine-size-http.outputs.result}}"

        - - name: pull-http
            template: pull-http
            when: "{{workflow.parameters.srcType}} == 'http'"

    # # --- Check Availability in Destination (aws-cli) ---
    # - name: check-availability
    #   retryStrategy:
    #     limit: "2"

    #   script:
    #     image: amazon/aws-cli:latest
    #     command: [sh, -c]

    #     # Mount the volumes
    #     volumeMounts:
    #       - name: dst-secret-vol
    #         readOnly: true
    #         mountPath: /secrets/dst
    #       - mountPath: /etc/ssl/certs/
    #         name: ca-certificates
    #         readOnly: true

    #     envFrom:
    #       - secretRef:
    #           name: s3-secret

    #     source: |
    #       if [[ ! -z ${{workflow.parameters.specMd5}} ]]; then
    #         bucket=$(echo {{workflow.parameters.specKey}} | cut -d/ -f1)
    #         key=$(echo {{workflow.parameters.specKey}} | cut -d/ -f2-)

    #         md5=$(aws --endpoint-url "{{workflow.parameters.srcRemoteURL}}" s3api head-object --bucket $bucket --key $key --query ETag --output text)
    #         if [ "$EXIT_CODE" -eq 0 ]; then
    #           if [[ $md5 != *${{workflow.parameters.specMd5}}* ]]; then
    #             echo "md5 mismatch, aborting"
    #             exit 1
    #           else
    #             echo "available"
    #           fi
