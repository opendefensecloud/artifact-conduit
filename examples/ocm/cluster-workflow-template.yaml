apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ocm-transfer-pipeline
spec:
  retryStrategy:
    retryPolicy: OnError
    limit: 1

  serviceAccountName: arc-workflow
  securityContext:
    fsGroup: 65532
    runAsUser: 65532

  # Mount certificate bundle
  volumes:
    - name: ca-certificates
      configMap:
        name: "root-bundle"
        defaultMode: 0644
        optional: false
        items:
          - key: trust-bundle.pem
            path: trust-bundle.pem
    - name: registry-storage
      emptyDir: {}

  # Define the PVC template for inter-step data sharing
  volumeClaimTemplates:
    - metadata:
        name: work-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specRepo
      - name: specComponent
      - name: specVersion
      - name: scanSeverity # Additional parameter coming from ArtifactType
      - name: scanExitCode # Additional parameter coming from ArtifactType
      - name: srcScheme
        value: "https"
      - name: dstScheme
        value: "https"

  entrypoint: ocm-pipeline

  templates:
    # --- Main Pipeline Entrypoint ---
    - name: ocm-pipeline
      steps:
        - - name: oci-registry
            template: oci-registry

        - - name: pull-resources
            template: pull-resources
            arguments:
              parameters:
              - name: registryIP
                value: "{{steps.oci-registry.ip}}"

        - - name: scan-all-images
            template: scan-all-images

        - - name: push-resoures
            template: push-resources

    # --- 0. Start temporary registry ---
    - name: oci-registry
      daemon: true                        # start registry as a daemon
      retryStrategy:
        limit: 10                         # retry container if it fails
      container:
        image: registry:3
        readinessProbe:                   # wait for readinessProbe to succeed
          httpGet:
            path: /v2/_catalog
            port: 5000
        volumeMounts:
          - name: registry-storage
            mountPath: /var/lib/registry

    # --- 1. Pull all resources & store them both on disk and registry ---
    - name: pull-resources
      inputs:
        parameters:
        - name: registryIP
      script:
        image: ghcr.io/opendefensecloud/ocm-tools:0.45.0
        command: [bash, -c]
        # Mount the secret volume to a temporary directory
        volumeMounts:
          - name: src-secret-vol
            readOnly: true
            mountPath: /secrets/src
          - name: work-volume
            mountPath: /data
          - name: ca-certificates
            readOnly: true
            mountPath: /etc/ssl/certs/
        # spec* parameters are the fields of the artifact's spec in the Order,
        # chosen by whoever creates the Order. All parameters are passed in as
        # environment variables and never interpolated into the script.
        # The spec* variables come first, because Kubernetes expands $(VAR) in a
        # value with the variables defined before it.
        env:
          - name: SPEC_REPO
            value: "{{workflow.parameters.specRepo}}"
          - name: SPEC_COMPONENT
            value: "{{workflow.parameters.specComponent}}"
          - name: SPEC_VERSION
            value: "{{workflow.parameters.specVersion}}"
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/trust-bundle.pem
          - name: SRC_REMOTE_URL
            value: "{{workflow.parameters.srcRemoteURL}}"
          - name: SRC_SECRET
            value: "{{workflow.parameters.srcSecret}}"
          - name: SRC_SCHEME
            value: "{{workflow.parameters.srcScheme}}"
          - name: REGISTRY_IP
            value: "{{inputs.parameters.registryIP}}"
        source: |
          set -euo pipefail
          export HOME=/tmp

          src_host=$(echo "$SRC_REMOTE_URL" | sed 's#^[a-z][a-z0-9+.-]*://##')

          if [ "$SRC_SECRET" = "true" ]; then
              echo "type: generic.config.ocm.software/v1
          configurations:
            - type: credentials.config.ocm.software
              consumers:
                - identity:
                    type: OCIRegistry
                    hostname: ${src_host%%[/:]*}
                  credentials:
                    - type: Credentials
                      properties:
                        username: $(cat /secrets/src/username)
                        password: $(cat /secrets/src/password)" > $HOME/.ocmconfig
          fi

          echo "Transfering to CTF..."
          if [ -n "$SPEC_REPO" ]; then
            component_url="${SRC_SCHEME}://${src_host}/${SPEC_REPO}//${SPEC_COMPONENT}:${SPEC_VERSION}"
          else
            component_url="${SRC_SCHEME}://${src_host}//${SPEC_COMPONENT}:${SPEC_VERSION}"
          fi
          ocm transfer component "$component_url" -r --copy-resources --copy-sources /data/ctf

          echo "Transfering CTF to temporary registry"
          if [ -n "$SPEC_REPO" ]; then
            temp_registry_url="http://${REGISTRY_IP}:5000/${SPEC_REPO}"
          else
            temp_registry_url="http://${REGISTRY_IP}:5000"
          fi
          ocm transfer ctf /data/ctf "$temp_registry_url"

          echo "Compile list of images for trivy"
          ocm get resources "${temp_registry_url}//${SPEC_COMPONENT}:${SPEC_VERSION}" -r -ojson > /data/resources.json
          cat /data/resources.json | jq -r '.items[] | select(.element.type == "ociImage") | .element.access.imageReference' > /data/images-tmp.txt
          cat /data/images-tmp.txt | sed 's/http:\/\///g' > /data/images.txt

          echo "Images for trivy to scan:"
          cat /data/images.txt

    # --- 2. Scan Image (Trivy) ---
    - name: scan-all-images
      script:
        image: aquasec/trivy:0.75.0
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data

        source: |
          set -euo pipefail
          while IFS="" read -r p || [ -n "$p" ]
          do
            echo "Scanning image for severities: $p"
            trivy image \
              --exit-code "$SCAN_EXIT_CODE" \
              --severity "$SCAN_SEVERITY" \
              --format json \
              --output /data/scan-results.json \
              --cache-dir /tmp/trivy-cache \
              "$p"
          done < /data/images.txt
        env:
          - name: PATH
            value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/share/trivy/sbin
          - name: SCAN_EXIT_CODE
            value: "{{workflow.parameters.scanExitCode}}"
          - name: SCAN_SEVERITY
            value: "{{workflow.parameters.scanSeverity}}"

    # --- 3. Push all resources ---
    - name: push-resources
      script:
        image: ghcr.io/opendefensecloud/ocm-tools:0.45.0
        command: [bash, -c]
        volumeMounts:
          - name: dst-secret-vol
            readOnly: true
            mountPath: /secrets/dst
          - name: work-volume
            mountPath: /data
          - name: ca-certificates
            readOnly: true
            mountPath: /etc/ssl/certs/
        env:
          - name: SPEC_REPO
            value: "{{workflow.parameters.specRepo}}"
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/trust-bundle.pem
          - name: DST_REMOTE_URL
            value: "{{workflow.parameters.dstRemoteURL}}"
          - name: DST_SECRET
            value: "{{workflow.parameters.dstSecret}}"
          - name: DST_SCHEME
            value: "{{workflow.parameters.dstScheme}}"
        source: |
          set -euo pipefail
          export HOME=/tmp

          dst_host=$(echo "$DST_REMOTE_URL" | sed 's#^[a-z][a-z0-9+.-]*://##')

          if [ "$DST_SECRET" = "true" ]; then
              echo "type: generic.config.ocm.software/v1
          configurations:
            - type: credentials.config.ocm.software
              consumers:
                - identity:
                    type: OCIRegistry
                    hostname: ${dst_host%%[/:]*}
                  credentials:
                    - type: Credentials
                      properties:
                        username: $(cat /secrets/dst/username)
                        password: $(cat /secrets/dst/password)" > $HOME/.ocmconfig
          fi

          if [ -n "$SPEC_REPO" ]; then
            dst_url="${DST_SCHEME}://${dst_host}/${SPEC_REPO}"
          else
            dst_url="${DST_SCHEME}://${dst_host}"
          fi
          ocm -X preferrelativeaccess=true transfer ctf /data/ctf "$dst_url"
