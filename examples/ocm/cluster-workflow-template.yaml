apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ocm-transfer-pipeline
spec:
  retryStrategy:
    retryPolicy: OnError
    limit: 1

  serviceAccountName: arc-workflow
  securityContext:
    fsGroup: 65532
    runAsUser: 65532

  # Credentials are recreated per pod and never stored on the data PVC.
  volumes:
    - name: registry-auth
      emptyDir:
        medium: Memory
    - name: ca-certificates
      configMap:
        name: "root-bundle"
        defaultMode: 0644
        optional: false
        items:
          - key: trust-bundle.pem
            path: trust-bundle.pem

  templateDefaults:
    initContainers:
      - name: registry-auth
        image: ghcr.io/opendefensecloud/ocm2-tools:0.21.0
        command: [bash, -c]
        volumeMounts:
          - name: src-secret-vol
            readOnly: true
            mountPath: /secrets/src
          - name: registry-auth
            mountPath: /auth
        env:
          - name: SRC_REMOTE_URL
            value: "{{workflow.parameters.srcRemoteURL}}"
          - name: SRC_SECRET
            value: "{{workflow.parameters.srcSecret}}"
          - name: SRC_SCHEME
            value: "{{workflow.parameters.srcScheme}}"
        args:
          - |
              set -euo pipefail
              umask 077
              src_host="${SRC_REMOTE_URL#*://}"
              mkdir -p /auth/docker
              printf '%s\n' '{"auths":{}}' > /auth/docker/config.json
              # Registry-scoped credentials stay in this pod's memory-backed volume.
              cat > /auth/ocmconfig <<'CONFIG'
              type: generic.config.ocm.software/v1
              configurations:
                - type: credentials.config.ocm.software/v1
                  repositories:
                    - repository:
                        type: DockerConfig/v1
                        dockerConfigFile: /auth/docker/config.json
              CONFIG
              if [ "$SRC_SECRET" = "true" ]; then
                registry="${src_host%%/*}"
                # Also match references that omit an explicit default port.
                case "$SRC_SCHEME" in
                  https) registry="${registry%:443}" ;;
                  http) registry="${registry%:80}" ;;
                esac
                jq -n --arg registry "$registry" --arg authority "${src_host%%/*}" \
                  --arg username "$(cat /secrets/src/username)" \
                  --arg password "$(cat /secrets/src/password)" '
                  {auths: {($registry): {auth: ($username + ":" + $password | @base64)},
                           ($authority): {auth: ($username + ":" + $password | @base64)}}}
                ' > /auth/docker/config.json
              fi

  # Define the PVC template for inter-step data sharing
  volumeClaimTemplates:
    - metadata:
        name: work-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specRepo
      - name: specComponent
      - name: specVersion
      - name: scanSeverity # Additional parameter coming from ArtifactType
      - name: scanExitCode # Additional parameter coming from ArtifactType
      - name: srcScheme
        value: "https"
      - name: dstScheme
        value: "https"

  entrypoint: ocm-pipeline

  templates:
    # Snapshot and scan the source before transferring to the destination.
    - name: ocm-pipeline
      steps:
        - - name: inspect-components
            template: inspect-components
        - - name: scan-all-images
            template: scan-all-images
        - - name: transfer-components
            template: transfer-components

    # Snapshot descriptors and all resources before scanning.
    - name: inspect-components
      script:
        image: ghcr.io/opendefensecloud/ocm2-tools:0.21.0
        command: [bash, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data
          - name: registry-auth
            mountPath: /auth
          - name: ca-certificates
            readOnly: true
            mountPath: /etc/ssl/certs/
        # spec* parameters are the fields of the artifact's spec in the Order,
        # chosen by whoever creates the Order. All parameters are passed in as
        # environment variables and never interpolated into the script.
        # The spec* variables come first, because Kubernetes expands $(VAR) in a
        # value with the variables defined before it.
        env:
          - name: SPEC_REPO
            value: "{{workflow.parameters.specRepo}}"
          - name: SPEC_COMPONENT
            value: "{{workflow.parameters.specComponent}}"
          - name: SPEC_VERSION
            value: "{{workflow.parameters.specVersion}}"
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/trust-bundle.pem
          - name: SRC_REMOTE_URL
            value: "{{workflow.parameters.srcRemoteURL}}"
          - name: SRC_SCHEME
            value: "{{workflow.parameters.srcScheme}}"
        source: |
          set -euo pipefail
          export HOME=/tmp

          src_host="${SRC_REMOTE_URL#*://}"

          echo "Inspecting source component descriptors..."
          if [ -n "$SPEC_REPO" ]; then
            component_url="${SRC_SCHEME}://${src_host}/${SPEC_REPO}//${SPEC_COMPONENT}:${SPEC_VERSION}"
          else
            component_url="${SRC_SCHEME}://${src_host}//${SPEC_COMPONENT}:${SPEC_VERSION}"
          fi
          # Capture external resources too, so scanning and transfer use the
          # same bytes even if source image tags change afterwards.
          ocm --config /auth/ocmconfig transfer cv "$component_url" ctf::/data/snapshot -r --copy-resources
          snapshot_url="ctf::/data/snapshot//${SPEC_COMPONENT}:${SPEC_VERSION}"
          printf '%s\n' "$snapshot_url" > /data/component.txt

          # Export image resources from the local CTF as standard OCI layouts.
          mkdir -p /data/images
          ocm --config /auth/ocmconfig get cv "$snapshot_url" --recursive -o json |
          jq -r '
            .[].component | . as $component | .resources[]? |
            select(.type == "ociImage") |
            ["\($component.name):\($component.version)",
             ({name} + (.extraIdentity // {}) |
              to_entries | map("\(.key)=\(.value)") | join(","))] | @tsv
          ' |
          while IFS=$'\t' read -r component identity; do
            layout=$(mktemp -d /data/images/image.XXXXXX)
            ocm --config /auth/ocmconfig download resource \
              "ctf::/data/snapshot//$component" --identity "$identity" --output "$layout"

            # Scan every image platform, excluding indexes and build attestations.
            jq -er --arg layout "$layout" '
              .manifests[] |
              select(.mediaType == "application/vnd.oci.image.manifest.v1+json" or
                     .mediaType == "application/vnd.docker.distribution.manifest.v2+json") |
              select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") |
              $layout + "@" + .digest
            ' "$layout/index.json" || {
              echo "Could not find scannable image manifests for $component ($identity) in $layout/index.json" >&2
              exit 1
            }
          done > /data/images.txt

    # Scan the captured OCI layouts without resolving source image tags again.
    - name: scan-all-images
      script:
        image: aquasec/trivy:0.75.0
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data
          - name: registry-auth
            mountPath: /auth
          - name: ca-certificates
            readOnly: true
            mountPath: /etc/ssl/certs/

        source: |
          set -euo pipefail
          mkdir -p /data/scan-results
          while IFS= read -r image; do
            echo "Scanning captured OCI artifact: $image"
            trivy image \
              --exit-code "$SCAN_EXIT_CODE" \
              --severity "$SCAN_SEVERITY" \
              --format json \
              --output "/data/scan-results/${image##*@}.json" \
              --cache-dir /tmp/trivy-cache \
              --input "$image"
          done < /data/images.txt
        env:
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/trust-bundle.pem
          - name: DOCKER_CONFIG
            value: /auth/docker
          - name: PATH
            value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/share/trivy/sbin
          - name: SCAN_EXIT_CODE
            value: "{{workflow.parameters.scanExitCode}}"
          - name: SCAN_SEVERITY
            value: "{{workflow.parameters.scanSeverity}}"

    # Transfer the inspected snapshot to the destination after scanning.
    - name: transfer-components
      script:
        image: ghcr.io/opendefensecloud/ocm2-tools:0.21.0
        command: [bash, -c]
        volumeMounts:
          - name: dst-secret-vol
            readOnly: true
            mountPath: /secrets/dst
          - name: work-volume
            mountPath: /data
          - name: registry-auth
            mountPath: /auth
          - name: ca-certificates
            readOnly: true
            mountPath: /etc/ssl/certs/
        env:
          - name: SPEC_REPO
            value: "{{workflow.parameters.specRepo}}"
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/trust-bundle.pem
          - name: DST_REMOTE_URL
            value: "{{workflow.parameters.dstRemoteURL}}"
          - name: DST_SECRET
            value: "{{workflow.parameters.dstSecret}}"
          - name: DST_SCHEME
            value: "{{workflow.parameters.dstScheme}}"
        source: |
          set -euo pipefail
          export HOME=/tmp

          umask 077
          dst_host="${DST_REMOTE_URL#*://}"
          if [ "$DST_SECRET" = "true" ]; then
            registry="${dst_host%%/*}"
            case "$DST_SCHEME" in
              https) registry="${registry%:443}" ;;
              http) registry="${registry%:80}" ;;
            esac
            jq --arg registry "$registry" --arg authority "${dst_host%%/*}" \
              --arg username "$(cat /secrets/dst/username)" \
              --arg password "$(cat /secrets/dst/password)" '
              .auths[$registry] = {auth: ($username + ":" + $password | @base64)} |
              .auths[$authority] = .auths[$registry]
            ' /auth/docker/config.json > /auth/docker/config-next.json
            mv /auth/docker/config-next.json /auth/docker/config.json
          fi

          if [ -n "$SPEC_REPO" ]; then
            dst_url="${DST_SCHEME}://${dst_host}/${SPEC_REPO}"
          else
            dst_url="${DST_SCHEME}://${dst_host}"
          fi
          snapshot_url=$(cat /data/component.txt)
          # Upload the captured resources from disk after all image scans pass.
          ocm --config /auth/ocmconfig \
            transfer cv "$snapshot_url" "$dst_url" -r --copy-resources --upload-as ociArtifact
