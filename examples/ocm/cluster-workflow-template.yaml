apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: ocm-transfer-pipeline
spec:
  retryStrategy:
    retryPolicy: OnError
    limit: 1

  serviceAccountName: arc-workflow
  securityContext:
    fsGroup: 65532
    runAsUser: 65532

  # Mount certificate bundle
  volumes:
    - name: ca-certificates
      configMap:
        name: "root-bundle"
        defaultMode: 0644
        optional: false
        items:
          - key: trust-bundle.pem
            path: trust-bundle.pem

  # Define the PVC template for inter-step data sharing
  volumeClaimTemplates:
    - metadata:
        name: work-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specRepo
      - name: specComponent
      - name: specVersion
      - name: scanSeverity # Additional parameter coming from ArtifactType
      - name: scanExitCode # Additional parameter coming from ArtifactType
      - name: srcScheme
        value: "https"
      - name: dstScheme
        value: "https"

  entrypoint: ocm-pipeline

  templates:
    # Inspect and scan the source before the only resource transfer.
    - name: ocm-pipeline
      steps:
        - - name: inspect-components
            template: inspect-components
        - - name: scan-all-images
            template: scan-all-images
        - - name: transfer-components
            template: transfer-components

    # Only descriptors and scan metadata are shared between steps.
    - name: inspect-components
      script:
        image: ghcr.io/opendefensecloud/ocm2-tools:0.21.0
        command: [bash, -c]
        # Mount the secret volume to a temporary directory
        volumeMounts:
          - name: src-secret-vol
            readOnly: true
            mountPath: /secrets/src
          - name: work-volume
            mountPath: /data
          - name: ca-certificates
            readOnly: true
            mountPath: /etc/ssl/certs/
        # spec* parameters are the fields of the artifact's spec in the Order,
        # chosen by whoever creates the Order. All parameters are passed in as
        # environment variables and never interpolated into the script.
        # The spec* variables come first, because Kubernetes expands $(VAR) in a
        # value with the variables defined before it.
        env:
          - name: SPEC_REPO
            value: "{{workflow.parameters.specRepo}}"
          - name: SPEC_COMPONENT
            value: "{{workflow.parameters.specComponent}}"
          - name: SPEC_VERSION
            value: "{{workflow.parameters.specVersion}}"
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/trust-bundle.pem
          - name: SRC_REMOTE_URL
            value: "{{workflow.parameters.srcRemoteURL}}"
          - name: SRC_SECRET
            value: "{{workflow.parameters.srcSecret}}"
          - name: SRC_SCHEME
            value: "{{workflow.parameters.srcScheme}}"
        source: |
          set -euo pipefail
          export HOME=/tmp

          umask 077
          src_host="${SRC_REMOTE_URL#*://}"
          mkdir -p /data/docker
          printf '%s\n' '{"auths":{}}' > /data/docker/config.json
          # OCM and Trivy share registry-scoped Docker credentials.
          cat > /data/ocmconfig <<'CONFIG'
          type: generic.config.ocm.software/v1
          configurations:
            - type: credentials.config.ocm.software/v1
              repositories:
                - repository:
                    type: DockerConfig/v1
                    dockerConfigFile: /data/docker/config.json
          CONFIG
          if [ "$SRC_SECRET" = "true" ]; then
            registry="${src_host%%/*}"
            # Also match references that omit an explicit default port.
            case "$SRC_SCHEME" in
              https) registry="${registry%:443}" ;;
              http) registry="${registry%:80}" ;;
            esac
            jq -n --arg registry "$registry" --arg authority "${src_host%%/*}" \
              --arg username "$(cat /secrets/src/username)" \
              --arg password "$(cat /secrets/src/password)" '
              {auths: {($registry): {auth: ($username + ":" + $password | @base64)},
                       ($authority): {auth: ($username + ":" + $password | @base64)}}}
            ' > /data/docker/config.json
          fi

          echo "Inspecting source component descriptors..."
          if [ -n "$SPEC_REPO" ]; then
            component_url="${SRC_SCHEME}://${src_host}/${SPEC_REPO}//${SPEC_COMPONENT}:${SPEC_VERSION}"
          else
            component_url="${SRC_SCHEME}://${src_host}//${SPEC_COMPONENT}:${SPEC_VERSION}"
          fi
          printf '%s\n' "$component_url" > /data/component.txt
          source_repository="${component_url%//*}"
          ocm --config /data/ocmconfig get cv "$component_url" --recursive -o json > /data/resources.json

          # V2 native local OCI blobs are already registry manifests in the
          # owning component repository. Scan those digests directly; do not
          # mistake referenceName (a relocation hint) for a reachable image.
          jq -r --arg repository "$source_repository" '
            [.[] | .component as $component | $component.resources[]? |
              select(.type == "ociImage") | .access as $access |
              if $access.imageReference then
                $access.imageReference
              elif ($access.type | split("/")[0] | ascii_downcase) == "localblob" then
                $repository + "/component-descriptors/" + $component.name + "@" +
                  ($access.localReference // error("ociImage has no localReference"))
              else error("unsupported ociImage access: " + $access.type) end
            ] | unique[]
          ' /data/resources.json > /data/images.txt
          echo "Source images for Trivy to scan:"
          cat /data/images.txt

    # Scan by reference using source credentials and trust.
    - name: scan-all-images
      script:
        image: aquasec/trivy:0.75.0
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data
          - name: ca-certificates
            readOnly: true
            mountPath: /etc/ssl/certs/

        source: |
          set -euo pipefail
          image_index=0
          while IFS="" read -r p || [ -n "$p" ]
          do
            echo "Scanning image for severities: $p"
            image_index=$((image_index + 1))
            plain_http=false
            case "$p" in
              http://*) plain_http=true; p="${p#http://}" ;;
              https://*) p="${p#https://}" ;;
            esac
            TRIVY_NON_SSL="$plain_http" trivy image \
              --exit-code "$SCAN_EXIT_CODE" \
              --severity "$SCAN_SEVERITY" \
              --format json \
              --output "/data/scan-results-${image_index}.json" \
              --cache-dir /tmp/trivy-cache \
              "$p"
          done < /data/images.txt
        env:
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/trust-bundle.pem
          - name: DOCKER_CONFIG
            value: /data/docker
          - name: PATH
            value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/share/trivy/sbin
          - name: SCAN_EXIT_CODE
            value: "{{workflow.parameters.scanExitCode}}"
          - name: SCAN_SEVERITY
            value: "{{workflow.parameters.scanSeverity}}"

    # Transfer resources once, directly from source to destination after scanning.
    - name: transfer-components
      script:
        image: ghcr.io/opendefensecloud/ocm2-tools:0.21.0
        command: [bash, -c]
        volumeMounts:
          - name: dst-secret-vol
            readOnly: true
            mountPath: /secrets/dst
          - name: work-volume
            mountPath: /data
          - name: ca-certificates
            readOnly: true
            mountPath: /etc/ssl/certs/
        env:
          - name: SPEC_REPO
            value: "{{workflow.parameters.specRepo}}"
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/trust-bundle.pem
          - name: DST_REMOTE_URL
            value: "{{workflow.parameters.dstRemoteURL}}"
          - name: DST_SECRET
            value: "{{workflow.parameters.dstSecret}}"
          - name: DST_SCHEME
            value: "{{workflow.parameters.dstScheme}}"
        source: |
          set -euo pipefail
          export HOME=/tmp

          umask 077
          dst_host="${DST_REMOTE_URL#*://}"
          if [ "$DST_SECRET" = "true" ]; then
            registry="${dst_host%%/*}"
            case "$DST_SCHEME" in
              https) registry="${registry%:443}" ;;
              http) registry="${registry%:80}" ;;
            esac
            jq --arg registry "$registry" --arg authority "${dst_host%%/*}" \
              --arg username "$(cat /secrets/dst/username)" \
              --arg password "$(cat /secrets/dst/password)" '
              .auths[$registry] = {auth: ($username + ":" + $password | @base64)} |
              .auths[$authority] = .auths[$registry]
            ' /data/docker/config.json > /data/docker/config-next.json
            mv /data/docker/config-next.json /data/docker/config.json
          fi

          if [ -n "$SPEC_REPO" ]; then
            dst_url="${DST_SCHEME}://${dst_host}/${SPEC_REPO}"
          else
            dst_url="${DST_SCHEME}://${dst_host}"
          fi
          component_url=$(cat /data/component.txt)
          # V2 copies resources; source archives remain by reference.
          ocm --config /data/ocmconfig \
            transfer cv "$component_url" "$dst_url" -r --copy-resources --upload-as ociArtifact
