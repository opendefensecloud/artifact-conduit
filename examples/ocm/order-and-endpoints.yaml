apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: ghcr
spec:
  type: oci # Endpoint Type!
  remoteURL: ghcr.io
  usage: PullOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: internal
spec:
  type: oci # Endpoint Type!
  remoteURL: dst.zot
  secretRef:
    name: dst-reg-secret
  usage: PushOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Order
metadata:
  name: example-ocm-order
spec:
  defaults:
    srcRef:
      name: ghcr
    dstRef:
      name: internal
  artifacts:
    - type: ocm # Artifact Type!
      spec:
        repo: opendefensecloud
        component: opendefense.cloud/arc
        version: 0.3.2
