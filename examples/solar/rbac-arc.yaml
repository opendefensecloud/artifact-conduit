---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-workflow
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-workflow-role
rules:
- apiGroups:
  - arc.opendefense.cloud
  resources:
  - artifactworkflows
  verbs:
  - get
  - list
  - watch
  - create
  - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-workflow-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arc-workflow-role
subjects:
- kind: ServiceAccount
  name: arc-workflow
  namespace: default
