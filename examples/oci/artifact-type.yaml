apiVersion: arc.bwi.de/v1alpha1
kind: ClusterArtifactType
metadata:
  name: oci
spec:
  rules:
    srcTypes: # Endpoint Types
      - oci
    dstTypes:
      - oci
  parameters:
    - name: scanSeverity
      value: HIGH,CRITICAL
    - name: srcTLSVerify
      value: "true"
    - name: dstTLSVerify
      value: "false"
  workflowTemplateRef: # argo.ClusterWorkflowTemplate
    name: oci-image-pipeline
