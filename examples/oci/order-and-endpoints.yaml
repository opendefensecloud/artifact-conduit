apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: gcrio
spec:
  type: oci # Endpoint Type!
  remoteURL: gcr.io
  usage: PullOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: dockerio
spec:
  type: oci # Endpoint Type!
  remoteURL: docker.io
  usage: PullOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: internal
spec:
  type: oci # Endpoint Type!
  remoteURL: dst.zot
  secretRef:
    name: dst-reg-secret
  usage: PushOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Order
metadata:
  name: example-oci-order
spec:
  defaults:
    srcRef:
      name: gcrio
    dstRef:
      name: internal
  artifacts:
    - type: oci # Artifact Type!
      spec:
        repository: distroless/static
        tag: nonroot
        override: "myteam/static:{{.tag}}-dev" # supports go templates
    - type: oci
      srcRef:
        name: dockerio
      # tag can be a version constraint!
      # See Masterminds/semver documentation for details:
      # https://github.com/Masterminds/semver?tab=readme-ov-file#checking-version-constraints
      # This is particularly useful in combination with cron orders, e.g. by adding:
      # cron:
      #   schedules:
      #   - "0 1 * * *" # every night at 01:00
      spec:
        repository: alpine
        tag: "^3.23"
