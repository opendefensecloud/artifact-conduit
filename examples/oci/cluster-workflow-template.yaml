apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: oci-image-pipeline
spec:
  # Define the PVC template for inter-step data sharing
  volumeClaimTemplates:
    - metadata:
        name: work-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

  # --- Required Volumes ---
  volumes:
    # Volume for Cosign signing key
    - name: signing-secret-vol
      secret:
        secretName: cosign-key # Assumes a secret named 'cosign-key' exists with the key/password

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specImage # The source image path (e.g., library/alpine:3.18)
      - name: specOverride # The target image path (e.g., myteam/alpine:3.18-dev)
      - name: scanSeverity # Additional parameter coming from ArtifactType
      - name: srcTLSVerify # Additional parameter coming from ArtifactType
      - name: dstTLSVerify # Additional parameter coming from ArtifactType

  entrypoint: oci-pipeline

  templates:
    # --- Main Pipeline Entrypoint ---
    - name: oci-pipeline
      steps:
        - - name: pull-image
            when: "{{workflow.parameters.srcType}} == oci"
            template: pull-image

        - - name: scan-image
            when: "{{workflow.parameters.srcType}} == oci"
            template: scan-image

        - - name: attest-scan
            when: "{{workflow.parameters.srcType}} == oci"
            template: attest-scan-results

        - - name: push-image
            when: "{{workflow.parameters.srcType}} == oci"
            template: push-image

    # --- 1. Pull Image (Skopeo) ---
    - name: pull-image

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]
        # Mount the secret volume to a temporary directory
        volumeMounts:
          - name: src-secret-vol
            readOnly: true
            mountPath: /secrets/src
          - name: work-volume
            mountPath: /data
        source: |
          set -euo pipefail

          echo "Pulling image from {{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specImage}}"
          mkdir -p /data/image-storage

          # Conditionally login to registry
          if [ "{{workflow.parameters.srcSecret}}" = "true" ]; then
              cat /secrets/src/password | skopeo login --tls-verify={{workflow.parameters.srcTLSVerify}} -u "$(cat /secrets/src/username)" --password-stdin {{workflow.parameters.srcRemoteURL}}
          fi

          # Construct the full source image path
          SOURCE_IMAGE="docker://{{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specImage}}"

          # Skopeo copy command
          skopeo copy --preserve-digests --src-tls-verify={{workflow.parameters.srcTLSVerify}} --multi-arch all $SOURCE_IMAGE "oci:/data/image-storage/scanned-image"

    # --- 2. Scan Image (Trivy) ---
    - name: scan-image
      script:
        image: aquasec/trivy:latest
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data

        source: |
          echo "Scanning image for severities: {{workflow.parameters.scanSeverity}}"

          # Trivy scan in a directory mode
          trivy image \
            --exit-code 1 \
            --severity "{{workflow.parameters.scanSeverity}}" \
            --format json \
            --output /data/scan-results.json \
            --input /data/image-storage/scanned-image

          if [ $? -eq 0 ]; then
              echo "✅ Scan successful and no vulnerabilities found above severity: {{workflow.parameters.scanSeverity}}"
          else
              echo "❌ Scan failed!"
              exit 1
          fi
        env:
          - name: PATH
            value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/share/trivy/sbin

    # --- 2.5. Attest Scan Results (Cosign) ---
    # This step uses the Cosign CLI to sign the scan results file and upload the attestation.
    - name: attest-scan-results
      script:
        image: gcr.io/projectsigstore/cosign/cli:latest
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data
          # Mount the secret containing the private key for Cosign
          - name: signing-secret-vol
            readOnly: true
            mountPath: /secrets/cosign
        env:
          # Set the password for the Cosign private key
          - name: COSIGN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cosign-key
                key: password
        source: |
          set -euo pipefail

          # The target image path is the destination URL + override spec
          DEST_IMAGE="{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}"
          ATTEST_FILE="/data/scan-results.json"
          PRIVATE_KEY="/secrets/cosign/cosign.key"

          echo "Generating and uploading scan attestation for $DEST_IMAGE"

          # Use Cosign to attach an attestation (predicate) to the image
          cosign attest \
            --key $PRIVATE_KEY \
            --predicate $ATTEST_FILE \
            --type vuln \
            $DEST_IMAGE

          echo "✅ Attestation complete."

    # --- 3. Push Image (Skopeo) ---
    - name: push-image

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]

        # Mount the secret volume to a temporary directory
        volumeMounts:
          - name: dst-secret-vol
            readOnly: true
            mountPath: /secrets/dst
          - name: work-volume
            mountPath: /data
          - name: signing-secret-vol
            readOnly: true
            mountPath: /secrets/cosign

        source: |
          set -euo pipefail

          echo "Pushing image to {{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}"

          # Conditionally login to registry
          if [ "{{workflow.parameters.dstSecret}}" = "true" ]; then
              cat /secrets/dst/password | skopeo login --tls-verify={{workflow.parameters.dstTLSVerify}} -u "$(cat /secrets/dst/username)" --password-stdin {{workflow.parameters.dstRemoteURL}}
          fi

          # Construct the full destination image path
          DEST_IMAGE="docker://{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}"

          # Sign the image
          echo "Signing image with key in /secrets/cosign/cosign.key"
          SIGNING_ARGS=" --sign-key /secrets/cosign/cosign.key"

          # Skopeo copy command
          skopeo copy ${SIGNING_ARGS} --dest-tls-verify={{workflow.parameters.dstTLSVerify}} "oci:/data/image-storage/scanned-image" $DEST_IMAGE
