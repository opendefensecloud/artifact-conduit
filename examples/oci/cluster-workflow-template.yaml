apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: oci-image-pipeline
spec:
  # Define the PVC template for inter-step data sharing
  volumeClaimTemplates:
    - metadata:
        name: work-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specImage # The source image path (e.g., library/alpine:3.18)
      - name: specOverride # The target image path (e.g., myteam/alpine:3.18-dev)
      - name: scanSeverity # Additional parameter coming from ArtifactType
      - name: srcTLSVerify # Additional parameter coming from ArtifactType
      - name: dstTLSVerify # Additional parameter coming from ArtifactType

  entrypoint: oci-pipeline

  templates:
    # --- Main Pipeline Entrypoint ---
    - name: oci-pipeline
      steps:
        - - name: authenticate-registries
            template: authenticate-registries

        - - name: pull-image
            template: pull-image

        - - name: scan-image
            template: scan-image

        - - name: push-image
            template: push-image

        - - name: attest-scan
            template: attest-scan-results

        - - name: sign-image
            template: sign-image

    # --- 0. Authenticate (Skopeo) ---
    - name: authenticate-registries

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]

        # Mount the volumes
        volumeMounts:
          - name: src-secret-vol
            readOnly: true
            mountPath: /secrets/src
          - name: dst-secret-vol
            readOnly: true
            mountPath: /secrets/dst
          - name: work-volume
            mountPath: /data

        source: |
          set -euo pipefail

          # Conditionally login to source registry
          if [ "{{workflow.parameters.srcSecret}}" = "true" ]; then
              echo "Authenticating to source registry {{workflow.parameters.srcRemoteURL}}..."
              cat /secrets/src/password | skopeo login --tls-verify={{workflow.parameters.srcTLSVerify}} -u "$(cat /secrets/src/username)" --password-stdin {{workflow.parameters.srcRemoteURL}} --compat-auth-file /data/.docker/config.json
          fi

          # Conditionally login to destination registry
          if [ "{{workflow.parameters.dstSecret}}" = "true" ]; then
              echo "Authenticating to destination registry {{workflow.parameters.dstRemoteURL}}..."
              cat /secrets/dst/password | skopeo login --tls-verify={{workflow.parameters.dstTLSVerify}} -u "$(cat /secrets/dst/username)" --password-stdin {{workflow.parameters.dstRemoteURL}} --compat-auth-file /data/.docker/config.json
          fi

    # --- 1. Pull Image (Skopeo) ---
    - name: pull-image

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]
        # Mount the secret volume to a temporary directory
        volumeMounts:
          - name: work-volume
            mountPath: /data
        source: |
          set -euo pipefail

          echo "Pulling image from {{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specImage}}"
          mkdir -p /data/image-storage

          skopeo copy --preserve-digests --src-tls-verify={{workflow.parameters.srcTLSVerify}} --multi-arch all docker://{{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specImage}} "oci:/data/image-storage/scanned-image"

        env:
          - name: REGISTRY_AUTH_FILE
            value: /data/.docker/config.json

    # --- 2. Scan Image (Trivy) ---
    - name: scan-image
      script:
        image: aquasec/trivy:latest
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data

        source: |
          echo "Scanning image for severities: {{workflow.parameters.scanSeverity}}"

          # Trivy scan in a directory mode
          trivy image \
            --exit-code 1 \
            --severity "{{workflow.parameters.scanSeverity}}" \
            --format json \
            --output /data/scan-results.json \
            --input /data/image-storage/scanned-image

          if [ $? -eq 0 ]; then
              echo "✅ Scan successful and no vulnerabilities found above severity: {{workflow.parameters.scanSeverity}}"
          else
              echo "❌ Scan failed!"
              exit 1
          fi
        env:
          - name: PATH
            value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/share/trivy/sbin

    # --- 3. Push Image (Skopeo) ---
    - name: push-image

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]

        # Mount the secret volume to a temporary directory
        volumeMounts:
          - name: work-volume
            mountPath: /data

        source: |
          set -euo pipefail

          echo "Pushing image to {{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}"
          skopeo copy --dest-tls-verify={{workflow.parameters.dstTLSVerify}} "oci:/data/image-storage/scanned-image" docker://{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}

        env:
          - name: REGISTRY_AUTH_FILE
            value: /data/.docker/config.json

    # --- 4. Attest Scan Results (Cosign) ---
    - name: attest-scan-results
      container:
        image: ghcr.io/sigstore/cosign/cosign:v3.0.2
        command:
          - cosign
          - attest
          - --allow-http-registry=true
          - --key
          - k8s://{{workflow.namespace}}/cosgin-key
          - --predicate
          - /data/scan-results.json
          - --type
          - vuln
          - "{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}"
        env:
          - name: DOCKER_CONFIG
            value: /data/.docker/config.json
        volumeMounts:
          - name: work-volume
            mountPath: /data

    # --- 5. Sign the image (Cosign) ---
    - name: sign-image
      container:
        image: ghcr.io/sigstore/cosign/cosign:v3.0.2
        command:
          - cosign
          - sign
          - --allow-http-registry=true
          - --key
          - k8s://{{workflow.namespace}}/cosgin-key
          - "{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}"
        env:
          - name: DOCKER_CONFIG
            value: /data/.docker/config.json
        volumeMounts:
          - name: work-volume
            mountPath: /data
