apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: oci-image-pipeline
spec:
  retryStrategy:
    retryPolicy: OnError
    limit: 1

  serviceAccountName: arc-workflow
  securityContext:
    fsGroup: 65532
    runAsUser: 65532

  # Define the PVC template for inter-step data sharing
  volumeClaimTemplates:
    - metadata:
        name: work-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

  # Mount certificate bundle
  volumes:
    - name: ca-certificates
      configMap:
        name: "root-bundle"
        defaultMode: 0644
        optional: false
        items:
          - key: trust-bundle.pem
            path: trust-bundle.pem

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specImage # The source image path (e.g., library/alpine:3.18)
      - name: specOverride # The target image path (e.g., myteam/alpine:3.18-dev)
      - name: scanSeverity # Additional parameter coming from ArtifactType

  entrypoint: oci-pipeline

  templates:
    # --- Main Pipeline Entrypoint ---
    - name: oci-pipeline
      steps:
        - - name: authenticate-registries
            template: authenticate-registries

        - - name: check-availability
            template: check-availability

        - - name: pull-image
            template: pull-image
            when: "{{ steps.check-availability.outputs.result }} == 'unavailable'"

        - - name: scan-image
            template: scan-image
            when: "{{ steps.check-availability.outputs.result }} == 'unavailable'"

        - - name: push-image
            template: push-image
            when: "{{ steps.check-availability.outputs.result }} == 'unavailable'"

        - - name: attest-scan
            template: attest-scan-results
            when: "{{ steps.check-availability.outputs.result }} == 'unavailable'"

        - - name: sign-image
            template: sign-image
            when: "{{ steps.check-availability.outputs.result }} == 'unavailable'"

    # --- Authenticate (Skopeo) ---
    - name: authenticate-registries

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]

        # Mount the volumes
        volumeMounts: &volumeMounts
          - name: src-secret-vol
            readOnly: true
            mountPath: /secrets/src
          - name: dst-secret-vol
            readOnly: true
            mountPath: /secrets/dst
          - name: work-volume
            mountPath: /data
          - mountPath: /etc/ssl/certs/
            name: ca-certificates
            readOnly: true

        env: &env
          - name: DOCKER_CONFIG
            value: /data/.docker
          - name: REGISTRY_AUTH_FILE
            value: /data/.docker/config.json

        source: |
          set -euo pipefail

          # Conditionally login to source registry
          if [ "{{workflow.parameters.srcSecret}}" = "true" ]; then
              echo "Authenticating to source registry {{workflow.parameters.srcRemoteURL}}..."
              cat /secrets/src/password | skopeo login -u "$(cat /secrets/src/username)" --password-stdin {{workflow.parameters.srcRemoteURL}} --compat-auth-file "${DOCKER_CONFIG}/config.json"
          fi

          # Conditionally login to destination registry
          if [ "{{workflow.parameters.dstSecret}}" = "true" ]; then
              echo "Authenticating to destination registry {{workflow.parameters.dstRemoteURL}}..."
              cat /secrets/dst/password | skopeo login -u "$(cat /secrets/dst/username)" --password-stdin {{workflow.parameters.dstRemoteURL}} --compat-auth-file "${DOCKER_CONFIG}/config.json"
          fi

    # --- Check Availability (Skopeo) ---
    - name: check-availability
      retryStrategy:
        limit: "2"

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]
        volumeMounts: *volumeMounts
        env: *env

        source: |
          skopeo inspect "docker://{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}" >/dev/null 2>&1

          EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
              echo "available"
          else
              # Image does not exist
              echo "unavailable"
          fi
          exit 0

    # --- Pull Image (Skopeo) ---
    - name: pull-image
      retryStrategy:
        limit: "2"

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]
        volumeMounts: *volumeMounts
        env: *env

        source: |
          set -euo pipefail

          echo "Pulling image from {{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specImage}}"
          mkdir -p /data/image-storage

          skopeo copy --preserve-digests --multi-arch all docker://{{workflow.parameters.srcRemoteURL}}/{{workflow.parameters.specImage}} "oci:/data/image-storage/scanned-image"

    - name: scan-image
      script:
        image: aquasec/trivy:latest
        command: [sh, -c]
        volumeMounts: *volumeMounts

        source: |
          echo "Scanning image for severities: {{workflow.parameters.scanSeverity}}"

          # Trivy scan in a directory mode
          trivy image \
            --cache-dir /data/.trivy/cache \
            --exit-code 1 \
            --severity "{{workflow.parameters.scanSeverity}}" \
            --format json \
            --output /data/scan-results.json \
            --input /data/image-storage/scanned-image

          if [ $? -eq 0 ]; then
              echo "✅ Scan successful and no vulnerabilities found above severity: {{workflow.parameters.scanSeverity}}"
          else
              echo "❌ Scan failed!"
              exit 1
          fi
        env: *env

    # --- Push Image (Skopeo) ---
    - name: push-image
      retryStrategy:
        limit: "2"

      script:
        image: quay.io/skopeo/stable:latest
        command: [sh, -c]

        # Mount the secret volume to a temporary directory
        volumeMounts: *volumeMounts

        source: |
          set -euo pipefail

          echo "Pushing image to {{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}"
          skopeo copy --dest-precompute-digests --preserve-digests "oci:/data/image-storage/scanned-image" "docker://{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}"
        env: *env

    # --- Attest Scan Results (Cosign) ---
    - name: attest-scan-results
      container:
        image: cgr.dev/chainguard/cosign:latest
        command: [cosign, attest]
        args:
          [
            "--allow-http-registry=true",
            "--key",
            "k8s://{{workflow.namespace}}/cosign-key",
            "--predicate",
            "/data/scan-results.json",
            "--type",
            "vuln",
            "{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}",
          ]
        env: *env
        volumeMounts: *volumeMounts

    # --- Sign the image (Cosign) ---
    - name: sign-image
      container:
        image: cgr.dev/chainguard/cosign:latest
        command: [cosign, sign]
        args:
          [
            "--yes",
            "--allow-http-registry=true",
            "--key",
            "k8s://{{workflow.namespace}}/cosign-key",
            "{{workflow.parameters.dstRemoteURL}}/{{workflow.parameters.specOverride}}",
          ]
        env: *env
        volumeMounts: *volumeMounts
