apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: helm-chart-pipeline
spec:
  serviceAccountName: arc-workflow

  # Define the PVC template for inter-step data sharing
  volumeClaimTemplates:
    - metadata:
        name: work-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

  # Mount certificate bundle
  volumes:
    - name: ca-certificates
      configMap:
        name: "root-bundle"
        defaultMode: 0644
        optional: false
        items:
          - key: trust-bundle.pem
            path: trust-bundle.pem

  # --- Input Parameters ---
  arguments:
    parameters:
      - name: srcType
      - name: srcRemoteURL
      - name: srcSecret
      - name: dstType
      - name: dstRemoteURL
      - name: dstSecret
      - name: specChart # Name of the chart
      - name: specRepo # OCI repo name for pull or push to OCI registry
      - name: specVersion # Version of the chart
      - name: scanSeverity # Additional parameter coming from ArtifactType

  entrypoint: helm-pipeline

  templates:
    # --- Main Pipeline Entrypoint ---
    - name: helm-pipeline
      steps:
        - - name: pull-chart-oci
            when: "{{workflow.parameters.srcType}} == oci"
            template: pull-chart-oci

        - - name: pull-chart-helm
            when: "{{workflow.parameters.srcType}} == helm"
            template: pull-chart-helm

        - - name: scan-chart
            template: scan-chart

        - - name: package-and-push # Always pushes to OCI
            template: package-and-push

    # --- 1A. Pull Chart from OCI Registry ---
    - name: pull-chart-oci
      script:
        image: alpine/helm:4.3.1
        command: [sh, -c]
        volumeMounts:
          - name: src-secret-vol
            readOnly: true
            mountPath: /secrets/src # For passing OCI login credentials
          - name: work-volume
            mountPath: /data

        # spec* parameters are the fields of the artifact's spec in the Order,
        # chosen by whoever creates the Order. All parameters are passed in as
        # environment variables and never interpolated into the script.
        # The spec* variables come first, because Kubernetes expands $(VAR) in a
        # value with the variables defined before it.
        env:
          - name: SPEC_REPO
            value: "{{workflow.parameters.specRepo}}"
          - name: SPEC_CHART
            value: "{{workflow.parameters.specChart}}"
          - name: SPEC_VERSION
            value: "{{workflow.parameters.specVersion}}"
          - name: SRC_REMOTE_URL
            value: "{{workflow.parameters.srcRemoteURL}}"
          - name: SRC_SECRET
            value: "{{workflow.parameters.srcSecret}}"

        source: |
          set -euo pipefail

          echo "Pulling OCI chart ${SRC_REMOTE_URL}/${SPEC_REPO}/${SPEC_CHART}:${SPEC_VERSION}"

          mkdir -p /data/charts
          cd /data/charts

          # Conditionally login to registry
          if [ "$SRC_SECRET" = "true" ]; then
              cat /secrets/src/password | helm registry login -u "$(cat /secrets/src/username)" --password-stdin "$SRC_REMOTE_URL"
          fi

          # The chart reference for OCI: oci://<repo-url>/<chart-name>
          CHART_REF="oci://${SRC_REMOTE_URL}/${SPEC_REPO}/${SPEC_CHART}"

          helm pull "$CHART_REF" \
            --version "$SPEC_VERSION" \
            --destination . \
            --untar

    # --- 1B. Pull Chart from Helm Repository ---
    - name: pull-chart-helm
      script:
        image: alpine/helm:4.3.1
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data
          - name: src-secret-vol
            readOnly: true
            mountPath: /secrets/src # For passing basic auth credentials
        env:
          - name: SPEC_CHART
            value: "{{workflow.parameters.specChart}}"
          - name: SPEC_VERSION
            value: "{{workflow.parameters.specVersion}}"
          - name: SRC_REMOTE_URL
            value: "{{workflow.parameters.srcRemoteURL}}"
          - name: SRC_SECRET
            value: "{{workflow.parameters.srcSecret}}"
        source: |
          set -euo pipefail

          echo "Pulling helm chart ${SPEC_CHART}:${SPEC_VERSION} from ${SRC_REMOTE_URL}"

          mkdir -p /data/charts
          cd /data/charts

          # Add the helm repository
          if [ "$SRC_SECRET" = "true" ]; then
              cat /secrets/src/password | helm repo add src-repo "$SRC_REMOTE_URL" --username "$(cat /secrets/src/username)" --password-stdin
          else
              helm repo add src-repo "$SRC_REMOTE_URL"
          fi

          # Update the index to ensure the chart is found
          helm repo update

          # Pull the specified chart version and unpack it
          helm pull "src-repo/${SPEC_CHART}" \
            --version "$SPEC_VERSION" \
            --destination . \
            --untar

    # --- 2. Lint/Validate Chart (Helm) ---
    - name: lint-chart
      script:
        image: alpine/helm:4.3.1
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data
        env:
          - name: SPEC_CHART
            value: "{{workflow.parameters.specChart}}"

        source: |
          cd "/data/charts/${SPEC_CHART}"

          helm lint .

          if [ $? -ne 0 ]; then
              echo "❌ Chart Linting failed!"
              exit 1
          fi

          echo "✅ Chart Linting successful!"

    # --- 2. Scan Chart (Helm) ---
    - name: scan-chart
      script:
        image: aquasec/trivy:0.75.0
        command: [sh, -c]
        volumeMounts:
          - name: work-volume
            mountPath: /data
        env:
          - name: SPEC_CHART
            value: "{{workflow.parameters.specChart}}"
          - name: SCAN_SEVERITY
            value: "{{workflow.parameters.scanSeverity}}"
        source: |
          echo "Scanning image for severities: $SCAN_SEVERITY"

          # Trivy scan in a directory mode
          trivy config \
            --cache-dir /data/.trivy/cache \
            --exit-code 1 \
            --severity "$SCAN_SEVERITY" \
            --format json \
            --output /data/scan-results.json \
            "/data/charts/${SPEC_CHART}"

          if [ $? -eq 0 ]; then
              echo "✅ Scan successful and no vulnerabilities found above severity: $SCAN_SEVERITY"
          else
              echo "❌ Scan failed!"
              cat /data/scan-results.json
              exit 1
          fi

    # --- 3. Package and Push Chart to OCI Destination ---
    - name: package-and-push
      script:
        image: alpine/helm:4.3.1
        command: [sh, -c]

        # Mount the secret volume for destination authentication
        volumeMounts:
          - name: dst-secret-vol
            readOnly: true
            mountPath: /secrets/dst
          - name: work-volume
            mountPath: /data
          - mountPath: /etc/ssl/certs/
            name: ca-certificates
            readOnly: true
        env:
          - name: SPEC_REPO
            value: "{{workflow.parameters.specRepo}}"
          - name: SPEC_CHART
            value: "{{workflow.parameters.specChart}}"
          - name: DST_REMOTE_URL
            value: "{{workflow.parameters.dstRemoteURL}}"
          - name: DST_SECRET
            value: "{{workflow.parameters.dstSecret}}"

        source: |
          set -euo pipefail
          cd /data/charts

          CHART_PATH="./${SPEC_CHART}"
          echo "Packaging chart from $CHART_PATH"

          # Package the unpacked chart back into a .tgz file
          # This step is the same regardless of the source type
          helm package "$CHART_PATH"

          TGZ_FILE=$(ls *.tgz | head -n 1)

          # Check if the chart version was updated (e.g., in a previous hypothetical step)
          # For simplicity, we assume the packaged name is correct.

          echo "Pushing $TGZ_FILE to OCI registry: oci://${DST_REMOTE_URL}"

          # Conditionally login to registry
          LOGIN_FLAGS=""
          if [ "$DST_SECRET" = "true" ]; then
              cat /secrets/dst/password | helm registry login ${LOGIN_FLAGS} -u "$(cat /secrets/dst/username)" --password-stdin "$DST_REMOTE_URL"
          fi

          # Push to the OCI registry (Destination)
          helm push "$TGZ_FILE" "oci://${DST_REMOTE_URL}/${SPEC_REPO}"

          if [ $? -ne 0 ]; then
              echo "❌ Helm Push failed!"
              exit 1
          fi

          echo "✅ Helm Chart pushed successfully to OCI!"
