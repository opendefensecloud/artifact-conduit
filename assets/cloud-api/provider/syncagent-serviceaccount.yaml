---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-syncagent
---
apiVersion: v1
kind: Secret
metadata:
  name: arc-syncagent-token
  annotations:
    kubernetes.io/service-account.name: arc-syncagent
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-syncagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: arc-syncagent
  namespace: default
