# ARC Orders — bundled generic UI (list + detail + create modal), namespace-scoped.
# Structure (proven against platform-mesh network/storage/sdn providers):
#   - the list node (entityType …account.namespace) holds the single resourceDefinition with
#     listView + createView + detailView (defined once);
#   - the :orderId child is a pure entity definition (defineEntity + context.resourceId, no url)
#     so the detail view resolves the SELECTED order — previously it had no resourceId and fell
#     back to the account context, rendering the account name ("demo");
#   - the dashboard node renders #generic-detail-view and inherits the detailView via the entity
#     chain.
# Default source/destination create fields use namespace-scoped gql lookups of ARC Endpoints
# (arc_opendefense_cloud.v1alpha1.Endpoints.items). Endpoint refs live on spec.defaults (srcRef,
# dstRef) — per-artifact overrides are not supported by the syncagent mutation engine (gjson *
# cannot iterate arrays), so the generic UI always writes to the defaults level. Field paths match
# ARC's Order APIResourceSchema (OrderSpec{TTLSecondsAfterCompletion,
# defaults:OrderDefaults{srcRef,dstRef,cron},
# artifacts[]:OrderArtifact{type,srcRef,dstRef,cron,spec}}; OrderStatus{message,lastReconcileAt,
# lastForceAt,artifactWorkflows}). cssRules for value-conditional styling (valueRules does NOT
# exist).
# Task 5: spec.artifact (singular) is retired; createViews on the 4 transfer-type nodes now author
# spec.artifacts[] via propertyCollection (repeatable card per artifact/image, add-as-many-as-needed
# orders).
#
# detailView renders ALL artifacts of an Order (the "deferred multi-row view" from the spec's Out of
# scope). Two non-obvious portal-ui-lib behaviours drive the shape below — both read out of the
# DEPLOYED bundle (portal:local, /assets/platform-mesh-portal-ui-wc.js), which is NEWER than the
# portal-ui-lib v0.46.1 source checkout (that version has no propertyCollection at all):
#
#   1. propertyCollection works in detailView, not just in createView: mfp-resource-field checks
#      isCollection() (= propertyCollection non-empty) and delegates to mfp-resource-collection-field,
#      which renders one expandable card per array entry. The card HEADER is the first sub-field with
#      a non-empty value (previewFor()) — hence Repository/Chart/Component/Key are listed FIRST, so
#      each card is titled by the artifact's identity ("Repository: stefanprodan/podinfo") instead of
#      a useless "Artifact type: oci". Empty sub-fields are skipped, so one row list serves all 4
#      types (an oci artifact's ocm/helm/blob params sync as "" and simply don't render).
#      Sub-field property paths are absolute; the lib strips the parent "spec.artifacts." prefix.
#
#   2. detailView.fields are RENDERED but never FETCHED. getDetailViewQueryFields() builds the
#      GraphQL query from ui.createView.fields (+ metadata.deletionTimestamp + detailView's
#      resourceTitle/resourceDescription) — detailView.fields is only read by viewFields() for
#      rendering. This node has no createView (creation goes through the 4 type-locked nodes), so
#      every detail field rendered blank. Since resourceTitle is a FieldDefinition whose `property`
#      IS added to the query, and resourceTitleDefinition only ever reads its `.label`, a
#      resourceTitle with a property array and NO label declares the fetch paths while leaving the
#      header title at its dynamic default (the Order name). That is what the resourceTitle block
#      below is: a fetch declaration, not a title. It must list every path the fields render.
#      Adding a real createView here would fix the fetch the "intended" way but would also put a
#      generic Create button on the Orders list (rejected in the design) and render status.* as
#      create-form inputs. Harmless once upstream teaches the detail view to fetch its own fields.
#
# listView columns Source/Destination/Artifact type point at the bare (unindexed) array property
# spec.artifacts.{srcRef.name,dstRef.name,type}. That question is no longer UNVERIFIED: JSONPath
# dot-child access does not iterate arrays, so "$.spec.artifacts.srcRef.name" yields 0 matches and
# the cells render EMPTY (resource-field-by-path takes matches[0]). Those three columns are still
# broken — see docs/superpowers/plans/2026-07-14-arc-multi-artifact-orders.md Task 8 Step 7.
apiVersion: ui.platform-mesh.io/v1alpha1
