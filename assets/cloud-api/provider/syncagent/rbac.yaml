---
# Supplemental service-cluster RBAC for ARC resources (chart provides secrets/namespaces/CRDs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-syncagent:arc-access
rules:
  - apiGroups: ["arc.opendefense.cloud"]
    resources: ["orders", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["arc.opendefense.cloud"]
    resources: ["orders/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-syncagent:arc-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arc-syncagent:arc-access
subjects:
  - kind: ServiceAccount
    name: arc-syncagent
    namespace: arc-system
---
# Chart lacks secret delete/patch; needed for Endpoint credential Secret cleanup.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-syncagent:secrets
  namespace: arc-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-syncagent:secrets
  namespace: arc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arc-syncagent:secrets
subjects:
  - kind: ServiceAccount
    name: arc-syncagent
    namespace: arc-system
