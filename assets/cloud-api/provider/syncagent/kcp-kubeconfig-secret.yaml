---
# Populate server, CA, and token before deploying.
apiVersion: v1
kind: Secret
metadata:
  name: arc-syncagent-kcp-kubeconfig
  namespace: arc-system
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    current-context: syncagent
    clusters:
    - cluster:
        certificate-authority-data: TODO  # base64-encoded CA from kcp server
        server: https://TODO              # kcp server URL
      name: kcp
    contexts:
    - context:
        cluster: kcp
        user: syncagent
      name: syncagent
    users:
    - name: syncagent
      user:
        token: TODO  # extract from arc-syncagent-token Secret after creation
