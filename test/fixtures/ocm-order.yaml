apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: ocm-source
spec:
  type: oci # Endpoint Type!
  remoteURL: ghcr.io
  usage: PullOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: ocm-destination
spec:
  type: oci # Endpoint Type!
  remoteURL: dst.zot/destination
  secretRef:
    name: dst-reg-secret
  usage: PushOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Order
metadata:
  name: example-ocm-order
spec:
  defaults:
    srcRef:
      name: ocm-source
    dstRef:
      name: ocm-destination
  artifacts:
    - type: ocm # Artifact Type!
      spec:
        repo: opendefensecloud
        component: opendefense.cloud/arc
        version: 0.3.2
