apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-workflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-workflow
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
      - persistentvolumeclaims
      - persistentvolumeclaims/status
    verbs:
      - create
      - delete
      - get
      - list
      - watch
      - update
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-workflow
subjects:
  - kind: ServiceAccount
    name: arc-workflow
roleRef:
  kind: Role
  name: arc-workflow
  apiGroup: rbac.authorization.k8s.io
