apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arc-zot-tls
  namespace: zot
spec:
  secretName: arc-zot-tls
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-ca-issuer
  usages:
    - server auth
    - client auth
  subject:
    organizations:
      - cert-manager
  dnsNames:
    - src.zot
    - dst.zot
