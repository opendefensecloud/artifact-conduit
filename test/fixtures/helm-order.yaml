apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: ghcr
spec:
  type: oci
  remoteURL: ghcr.io
  usage: PullOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: internal
spec:
  type: oci
  remoteURL: dst.zot
  secretRef:
    name: dst-reg-secret
  usage: PushOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Order
metadata:
  name: example-helm-order
spec:
  defaults:
    srcRef:
      name: ghcr
    dstRef:
      name: internal
  artifacts:
    - type: helm
      spec:
        repo: stefanprodan/charts
        chart: podinfo
        version: 6.9.2
