apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: gcrio
spec:
  type: oci
  remoteURL: gcr.io
  usage: PullOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Endpoint
metadata:
  name: internal
spec:
  type: oci
  remoteURL: dst.zot
  secretRef:
    name: dst-reg-secret
  usage: PushOnly
---
apiVersion: arc.opendefense.cloud/v1alpha1
kind: Order
metadata:
  name: test-oci-cron-order
spec:
  defaults:
    srcRef:
      name: gcrio
    dstRef:
      name: internal
  artifacts:
    - type: oci # Artifact Type!
      cron:
        schedules:
        - "*/2 * * * *" # every two minutes
      spec: # should be quick as it should be cached
        repository: distroless/static
        tag: nonroot
        override: "myteam/static:{{.tag}}-dev" # supports go templates
