# Single-node Garage as S3 destination. On startup it creates the access key
# (must match s3-secret in secret.yaml) and the bucket before serving S3.
apiVersion: v1
kind: Namespace
metadata:
  name: garage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dst-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    replication_factor = 1
    rpc_bind_addr = "0.0.0.0:3901"
    rpc_secret = "1a81ea3e75d89c132e3885c43d1ab4dbd28265ce8eadc86b735b978fda72ccd0"

    [s3_api]
    # aws-cli signs with us-east-1 when no region is configured
    s3_region = "us-east-1"
    api_bind_addr = "0.0.0.0:3900"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dst
  namespace: garage
spec:
  selector:
    matchLabels:
      app: dst
  template:
    metadata:
      labels:
        app: dst
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          command: ["/garage", "server", "--single-node", "--default-bucket"]
          env:
            - name: GARAGE_DEFAULT_ACCESS_KEY
              value: arc-e2e-access
            - name: GARAGE_DEFAULT_SECRET_KEY
              value: arc-e2e-secret-key
            - name: GARAGE_DEFAULT_BUCKET
              value: test
          readinessProbe:
            tcpSocket:
              port: 3900
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
      volumes:
        - name: config
          configMap:
            name: dst-config
---
apiVersion: v1
kind: Service
metadata:
  name: dst
  namespace: garage
spec:
  selector:
    app: dst
  ports:
    - port: 3900
