apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: executor
subjects:
  - kind: ServiceAccount
    name: default
roleRef:
  kind: Role
  name: executor
  apiGroup: rbac.authorization.k8s.io
