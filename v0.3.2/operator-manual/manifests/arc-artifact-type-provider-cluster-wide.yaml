apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-artifact-type-provider
rules:
  - apiGroups:
      - arc.opendefense.cloud
    resources:
      - artifacttypes
      - clusterartifacttypes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtemplates
      - clusterworkflowtemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - arc.opendefense.cloud
    resources:
      - endpoints
      - artifactworkflows
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
      - cronworkflows
    verbs:
      - get
      - list
      - watch
---
# Grants the arc-artifact-type-provider ClusterRole in every namespace, which is
# equivalent to get on the Secrets of every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-artifact-type-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arc-artifact-type-provider
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: artifact-type-providers
