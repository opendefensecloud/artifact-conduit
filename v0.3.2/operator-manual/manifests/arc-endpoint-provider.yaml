apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-endpoint-provider
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - arc.opendefense.cloud
    resources:
      - endpoints
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - arc.opendefense.cloud
    resources:
      - artifacttypes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-endpoint-provider
  namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arc-endpoint-provider
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: team-a:endpoint-providers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-endpoint-provider-cluster
rules:
  - apiGroups:
      - arc.opendefense.cloud
    resources:
      - clusterartifacttypes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-endpoint-provider-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arc-endpoint-provider-cluster
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: team-a:endpoint-providers
